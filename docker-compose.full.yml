name: legal-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legal_ai
      POSTGRES_USER: legal_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CAMBIAR_POR_SEGURO}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/schema:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_user -d legal_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: legal-ai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-CAMBIAR_POR_SEGURO}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CAMBIAR_POR_SEGURO}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: legal-ai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CAMBIAR_POR_SEGURO}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: legal-ai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://legal_user:${DB_PASSWORD:-CAMBIAR_POR_SEGURO}@postgres:5432/legal_ai
      REDIS_URL: redis://:${REDIS_PASSWORD:-CAMBIAR_POR_SEGURO}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-CAMBIAR_POR_SEGURO}
      MINIO_BUCKET: legal-documents
      JWT_SECRET: ${JWT_SECRET:-CAMBIAR_POR_SEGURO}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-CAMBIAR_POR_SEGURO}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-CAMBIAR_POR_SEGURO}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      DEFAULT_CREDITS_PER_USER: ${DEFAULT_CREDITS_PER_USER:-1000}
      DAILY_CREDIT_LIMIT: ${DAILY_CREDIT_LIMIT:-200}
    ports:
      - "3001:3001"

  ai:
    build:
      context: apps/ai
    container_name: legal-ai-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://legal_user:${DB_PASSWORD:-CAMBIAR_POR_SEGURO}@postgres:5432/legal_ai
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-CAMBIAR_POR_SEGURO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: legal-ai-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
