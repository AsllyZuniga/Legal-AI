name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-node:
    name: Build (turbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder

      - name: Build all workspaces
        run: npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  check-python:
    name: Syntax check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile apps/ai
        run: python -m compileall -q apps/ai/app

      - name: Compile apps/mcp
        run: python -m compileall -q apps/mcp/server.py apps/mcp/generar_agentes.py
